<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="app"></div>
  <script src="molstar.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
