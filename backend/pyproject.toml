[project]
name = "dimitri-backend"
version = "0.1.0"
description = "Local FastAPI backend for Dimitri Studio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "biopython>=1.84",
    "pydantic>=2.7",
    "gemmi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dimitri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
    "ignore::Bio.PDB.PDBExceptions.PDBConstructionWarning",
]
